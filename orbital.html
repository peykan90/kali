
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HELL ORBIT | Kali Terminal</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  background: radial-gradient(ellipse at 25% 40%, #20050b, #080205 45%, #010101);
  color: #d5ffd9;
  font-family: Consolas, "Courier New", monospace;
}

.stars {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(1px 1px at 15% 20%, white 99%, transparent),
    radial-gradient(1px 1px at 70% 15%, #ff5268 99%, transparent),
    radial-gradient(2px 2px at 45% 80%, white 99%, transparent),
    radial-gradient(1px 1px at 85% 65%, #ff1838 99%, transparent);
  background-size: 280px 250px;
  animation: twinkle 4s infinite alternate;
}

@keyframes twinkle {
  from { opacity: .2; }
  to { opacity: .8; }
}

.layout {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  gap: 30px;
  padding: 30px;
  min-height: 100vh;
}

.scene {
  min-height: 570px;
  display: grid;
  place-items: center;
  position: relative;
}

.caption {
  position: absolute;
  top: 25px;
  left: 3%;
  color: #a85a68;
  font-size: 11px;
  letter-spacing: 3px;
}

.caption h1 {
  font-family: Arial, sans-serif;
  font-size: clamp(30px, 4vw, 54px);
  color: #ffe5e9;
  letter-spacing: 5px;
  text-shadow: 0 0 10px #ff1838, 0 0 30px #b00020;
}

.caption p { color: #ff1838; }

.planet-wrap {
  width: min(34vw, 350px);
  aspect-ratio: 1;
  position: relative;
  isolation: isolate;
}

.planet-wrap::before {
  content: "";
  position: absolute;
  inset: -20%;
  border-radius: 50%;
  background: radial-gradient(circle, transparent 45%, #ff001a33 65%, transparent 75%);
  animation: pulse 3s infinite ease-in-out;
  z-index: -1;
}

@keyframes pulse {
  0%, 100% { opacity: .3; transform: scale(.95); }
  50% { opacity: 1; transform: scale(1.07); }
}

.planet {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 25% 30%, #b31b28 0%, transparent 18%),
    radial-gradient(ellipse at 65% 65%, #650815 0%, transparent 30%),
    radial-gradient(ellipse at 40% 75%, #8a2616 0%, transparent 20%),
    radial-gradient(circle at 30% 25%, #701522, #300711 40%, #0a0205 75%, #000);
  box-shadow:
    inset -50px -20px 70px #000,
    inset 8px 5px 20px #ff252544,
    0 0 30px #ff001a66,
    0 0 90px #a0001844;
  animation: planetDrift 8s ease-in-out infinite;
}

.planet::before {
  content: "";
  position: absolute;
  inset: -20%;
  border-radius: 50%;
  background: repeating-linear-gradient(
    160deg,
    transparent 0 25px,
    #ff1b3028 26px 28px,
    transparent 30px 48px
  );
  transform: rotate(-12deg);
}

.planet::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background:
    radial-gradient(ellipse at 35% 40%, transparent 0 10%, #030102bb 11% 14%, transparent 15%),
    radial-gradient(ellipse at 68% 55%, #000 0 5%, transparent 7%),
    linear-gradient(100deg, transparent 10%, #17010799 48%, #000 90%);
  box-shadow: inset -25px 0 40px #000;
}

@keyframes planetDrift {
  0%, 100% { transform: translateY(0) rotate(-2deg); }
  50% { transform: translateY(-12px) rotate(2deg); }
}

.orbit {
  position: absolute;
  width: 150%;
  height: 150%;
  top: -25%;
  left: -25%;
  border: 1px solid #ff283b55;
  border-radius: 50%;
  transform: rotate(-23deg);
}

.moon-orbit {
  position: absolute;
  inset: -18%;
  border: 1px solid #ff384744;
  border-radius: 50%;
  animation: orbit 9s linear infinite;
}

.moon {
  position: absolute;
  width: 48px;
  height: 48px;
  top: 50%;
  left: -24px;
  transform: translateY(-50%);
  border-radius: 50%;
  background: radial-gradient(circle at 28% 25%, #a88a8e, #564047 25%, #21151c 60%, #030203);
  box-shadow: inset -10px -6px 14px #000, 0 0 18px #ff102533;
}

.moon::after {
  content: "";
  position: absolute;
  width: 9px;
  height: 9px;
  top: 12px;
  left: 25px;
  border-radius: 50%;
  background: #100b11;
  box-shadow: -13px 13px 0 -2px #20141b, -4px 24px 0 -3px #080609;
}

@keyframes orbit {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.ring {
  position: absolute;
  width: 145%;
  height: 40%;
  top: 30%;
  left: -22%;
  border: 2px solid #ff354866;
  border-left-color: #ff354810;
  border-right-color: #ff3548aa;
  border-radius: 50%;
  transform: rotate(-18deg);
  filter: drop-shadow(0 0 8px #ff001a);
}

.hud {
  position: absolute;
  bottom: 20px;
  left: 3%;
  color: #a36a75;
  font-size: 11px;
  line-height: 2;
  letter-spacing: 2px;
}

.hud strong { color: #ff1838; }

.terminal {
  direction: ltr;
  text-align: left;
  width: 100%;
  max-width: 650px;
  border: 1px solid #ff174477;
  border-radius: 5px;
  overflow: hidden;
  background: linear-gradient(145deg, #160609f5, #030303fa);
  box-shadow: 0 0 40px #ff001a22, inset 0 0 35px #ff001a0a;
}

.terminal-top {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 13px 16px;
  background: #190809;
  border-bottom: 1px solid #ff174433;
}

.dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #ff3548;
}
.dot:nth-child(2) { background: #8d202b; }
.dot:nth-child(3) { background: #7dff00; }

.term-title {
  margin-left: auto;
  color: #b57880;
  font-size: 10px;
  letter-spacing: 1px;
}

.terminal-body {
  padding: 20px 18px 24px;
  min-height: 450px;
}

.label {
  color: #bd3848;
  font-size: 10px;
  letter-spacing: 2px;
  margin-bottom: 15px;
}

.prompt {
  color: #7dff00;
  font-size: 12px;
  line-height: 1.8;
  overflow-wrap: anywhere;
  margin-bottom: 12px;
}

.prompt span { color: #ff5268; }

#code {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  color: #c6f7c9;
  font-size: 12px;
  line-height: 1.75;
  min-height: 290px;
}

.cursor {
  display: inline-block;
  width: 8px;
  height: 14px;
  background: #ff1838;
  box-shadow: 0 0 8px #ff1838;
  animation: blink .8s steps(2) infinite;
}

@keyframes blink { 50% { opacity: 0; } }

.status {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: 20px;
  padding-top: 13px;
  border-top: 1px solid #ff17442a;
  color: #92545d;
  font-size: 9px;
  letter-spacing: 1px;
}

.status b { color: #7dff00; font-weight: 400; }

@media (max-width: 850px) {
  .layout {
    grid-template-columns: 1fr;
    padding: 16px;
    gap: 0;
  }
  .scene { min-height: 420px; }
  .planet-wrap { width: min(55vw, 260px); }
  .caption h1 { font-size: 30px; }
  .terminal { margin-bottom: 24px; }
  #code { font-size: 11px; min-height: 250px; }
}

</style>
</head>

<body>
<div class="stars"></div>

<main class="layout">
  <section class="scene">
    <div class="caption">
      <div>DEEP SPACE / SECTOR 07</div>
      <h1>HELL ORBIT</h1>
      <p>UNKNOWN WORLD // PX-071</p>
    </div>

    <div class="planet-wrap">
      <div class="orbit"></div>
      <div class="planet"></div>
      <div class="ring"></div>
      <div class="moon-orbit">
        <div class="moon"></div>
      </div>
    </div>

    <div class="hud">
      ORBIT STATUS: <strong>UNSTABLE</strong><br>
      PLANET ID: <strong>PX-071</strong><br>
      SIGNAL: <strong>UNKNOWN</strong>
    </div>
  </section>

  <section class="terminal">
    <div class="terminal-top">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="term-title">KALI LINUX // DARK CONSOLE</span>
    </div>

    <div class="terminal-body">
      <div class="label">DARK SYSTEM FEED // SIMULATION</div>
      <div class="prompt">
        ┌──( <span>kali㉿hell-orbit</span> )-[~]<br>
        └─$ <span id="command">whoami</span>
      </div>
      <div id="code"></div><span class="cursor"></span>
      <div class="status">
        <span>SESSION: <b>ACTIVE</b></span>
        <span>MODE: <b>SIMULATION</b></span>
      </div>
    </div>
  </section>
</main>

<script>
const scenes = [
{
 command: "whoami && id && uname -a",
 lines: [
  "kali",
  "uid=1000(kali) gid=1000(kali) groups=1000(kali),27(sudo)",
  "Linux hell-orbit 6.8.0-amd64 #1 SMP PREEMPT x86_64 GNU/Linux",
  "",
  "[ OK ] Identity check complete",
  "[ OK ] Kernel information loaded",
  "[WARN] Untrusted signal detected in sector 07",
  "[INFO] Monitoring local system status...",
  "[ OK ] Local diagnostics completed"
 ]
},
{
 command: "ip -brief address && ip route",
 lines: [
  "lo       UNKNOWN   127.0.0.1/8 ::1/128",
  "eth0     UP        192.168.1.42/24",
  "",
  "default via 192.168.1.1 dev eth0",
  "192.168.1.0/24 dev eth0 proto kernel scope link",
  "",
  "[ OK ] Interface report generated",
  "[INFO] Network display mode: DEMO",
  "[WARN] No external scan is being performed",
  "[ OK ] Report saved to /tmp/net-status.txt"
 ]
},
{
 command: "ss -tuln",
 lines: [
  "Netid State  Recv-Q Send-Q Local Address:Port",
  "tcp   LISTEN 0      128    127.0.0.1:631",
  "tcp   LISTEN 0      128    0.0.0.0:22",
  "udp   UNCONN 0      0      127.0.0.1:323",
  "",
  "Socket summary (example output)",
  "Listening TCP sockets: 2",
  "Listening UDP sockets: 1",
  "[ OK ] Local socket report complete",
  "[WARN] UNKNOWN SIGNAL // simulated event"
 ]
},
{
 command: "systemctl --no-pager --type=service",
 lines: [
  "UNIT                    LOAD   ACTIVE SUB",
  "ssh.service             loaded active running",
  "NetworkManager.service  loaded active running",
  "cron.service            loaded active running",
  "systemd-journald.service loaded active running",
  "",
  "LOAD   = Whether the unit definition was loaded.",
  "ACTIVE = High-level unit activation state.",
  "",
  "[ OK ] Service status overview complete",
  "[INFO] Awaiting next system cycle..."
 ]
},
{
 command: "journalctl -n 12 --no-pager",
 lines: [
  "Oct 22 19:47:01 hell-orbit kernel: Booting Linux",
  "Oct 22 19:47:02 hell-orbit systemd[1]: Started Network Manager",
  "Oct 22 19:47:03 hell-orbit orbit-core: Planet sync OK",
  "Oct 22 19:47:04 hell-orbit orbit-core: Moon trajectory stable",
  "Oct 22 19:47:05 hell-orbit network: Link is up",
  "Oct 22 19:47:06 hell-orbit terminal: Session ready",
  "Oct 22 19:47:07 hell-orbit security: Local checks passed",
  "Oct 22 19:47:08 hell-orbit sensor: UNKNOWN PING",
  "Oct 22 19:47:09 hell-orbit sensor: UNKNOWN PING",
  "Oct 22 19:47:10 hell-orbit monitor: Signal lost...",
  "Oct 22 19:47:11 hell-orbit orbit-core: Reconnecting",
  "Oct 22 19:47:12 hell-orbit orbit-core: Link restored"
 ]
},
{
 command: "python3 --version; git --version; df -h",
 lines: [
  "Python 3.12.3",
  "git version 2.43.0",
  "",
  "Filesystem      Size  Used Avail Use% Mounted on",
  "/dev/sda1       120G   48G   66G  43% /",
  "tmpfs           3.9G  1.2M  3.9G   1% /run",
  "",
  "[ OK ] Runtime checks completed",
  "[ OK ] Storage report generated",
  "[INFO] Awaiting next system cycle...",
  "[WARN] UNKNOWN PING // SECTOR 07"
 ]
}
];

const commandEl = document.getElementById("command");
const codeEl = document.getElementById("code");
let sceneIndex = 0;

const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

async function typeText(text) {
  for (const character of text) {
    codeEl.textContent += character;
    await sleep(character === "\n" ? 45 : 5 + Math.random() * 12);
  }
}

async function eraseText() {
  while (codeEl.textContent.length > 0) {
    const amount = Math.random() > 0.65 ? 3 : 1;
    codeEl.textContent = codeEl.textContent.slice(0, -amount);
    await sleep(5);
  }
}

async function runTerminal() {
  while (true) {
    const scene = scenes[sceneIndex];
    commandEl.textContent = scene.command;
    codeEl.textContent = "";

    await typeText(scene.lines.join("\n"));
    await sleep(2200);
    await eraseText();
    await sleep(350);

    sceneIndex = (sceneIndex + 1) % scenes.length;
  }
}

runTerminal();
</script>
</body>
</html>
